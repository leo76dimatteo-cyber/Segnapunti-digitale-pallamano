<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Sfondo Principale -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#143460" />
      <stop offset="70%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#061224" />
    </radialGradient>

    <!-- Gradiente Oro (Bordi e Banner) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="45%" stop-color="#E5B232" />
      <stop offset="75%" stop-color="#C68E17" />
      <stop offset="100%" stop-color="#F3D369" />
    </linearGradient>

    <!-- Gradiente Arancione Pallone -->
    <linearGradient id="ballOrange" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF9D3B" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#D94800" />
    </linearGradient>

    <!-- Gradiente Scia di Velocità -->
    <linearGradient id="flameGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA827" />
      <stop offset="50%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#D82300" />
    </linearGradient>

    <!-- Tracciato Curvo per il testo HANDBALL -->
    <path id="textArcTop" d="M 68,256 A 188,188 0 1,1 444,256" fill="none" />
  </defs>

  <!-- 1. BORDO ESTERNO E BASE CIRCOLARE -->
  <circle cx="256" cy="256" r="248" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="236" fill="#071526" />
  <circle cx="256" cy="256" r="226" fill="url(#bgGrad)" />

  <!-- Anelli Grafici Concentrici Interni -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#FF7A00" stroke-width="4" opacity="0.85" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- 2. RETE DELLA PORTA (Sfondo Campo) -->
  <g stroke="#1A4A7A" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <!-- Linee orizzontali rete -->
    <path d="M 120,175 L 392,175 M 110,205 L 402,205 M 105,235 L 407,235 M 110,265 L 402,265" />
    <!-- Linee verticali rete -->
    <path d="M 140,155 L 140,285 M 175,155 L 175,285 M 210,155 L 210,285 M 302,155 L 302,285 M 337,155 L 337,285 M 372,155 L 372,285" />
  </g>

  <!-- 3. SILHOUETTE GIOCATORE IN VOLO (Sinistra) -->
  <g fill="#1F63A6" stroke="#071526" stroke-width="2">
    <!-- Mini pallone in mano -->
    <circle cx="77" cy="186" r="14" fill="#FF8C00" stroke="#071526" stroke-width="2.5" />
    <!-- Testa -->
    <circle cx="152" cy="180" r="14" fill="#FFA500" />
    <!-- Braccio sinistro alzato verso la palla -->
    <path d="M 142,192 L 110,195 L 89,189 L 98,177 L 122,185 Z" fill="#2979C9" />
    <!-- Corpo e busto dinamico -->
    <path d="M 136,192 C 158,194 174,199 216,206 L 208,226 C 182,223 162,220 151,234 L 140,268 L 124,258 L 133,222 L 126,208 Z" fill="#2979C9" />
    <!-- Braccio destro disteso per equilibrio -->
    <path d="M 170,204 L 208,209 L 218,222 L 178,219 Z" fill="#1F63A6" />
    <!-- Gambe in salto/sforbiciata -->
    <path d="M 135,260 L 108,290 L 88,318 L 98,326 L 124,295 L 146,274 Z" fill="#184D83" />
    <path d="M 126,270 L 148,315 L 140,323 L 118,284 Z" fill="#123B66" />
  </g>

  <!-- 4. TABELLONE SEGNAPUNTI DIGITALE (Centro Superiore) -->
  <g id="scoreboard">
    <!-- Cornice esterna tabellone -->
    <rect x="178" y="104" width="156" height="66" rx="14" fill="#06101E" stroke="url(#goldGrad)" stroke-width="3.5" />
    <!-- Display interno antiriflesso -->
    <rect x="186" y="112" width="140" height="50" rx="9" fill="#0A182B" stroke="#18365D" stroke-width="2" />
    
    <!-- Punti Digitali LED 24 : 18 -->
    <!-- Cifra 24 -->
    <text x="222" y="148" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="34" fill="#FF9D00" text-anchor="middle" letter-spacing="1">24</text>
    <!-- Separatore a due punti -->
    <circle cx="256" cy="130" r="3.5" fill="#FF9D00" />
    <circle cx="256" cy="144" r="3.5" fill="#FF9D00" />
    <!-- Cifra 18 -->
    <text x="290" y="148" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="34" fill="#FF9D00" text-anchor="middle" letter-spacing="1">18</text>
  </g>

  <!-- 5. SCIA DI FUOCO E VELOCITÀ DEL PALLONE -->
  <g fill="url(#flameGrad)" opacity="0.95">
    <path d="M 285,255 L 200,325 L 132,365 L 195,338 L 148,377 L 222,342 L 180,388 L 260,350 L 225,394 L 320,348 Z" />
    <path d="M 245,285 L 175,342 L 140,366 L 190,346 L 160,375 L 230,345 Z" fill="#FFCC00" />
  </g>

  <!-- 6. PALLONE DA PALLAMANO PRINCIPALE -->
  <g id="handball-ball">
    <!-- Base circolare del pallone -->
    <circle cx="296" cy="272" r="88" fill="url(#ballOrange)" stroke="#071526" stroke-width="5" />

    <!-- Pannelli geometrici della palla da pallamano (Stile Flat vettoriale) -->
    <!-- Pannello pentagonale centrale -->
    <polygon points="280,242 316,242 332,270 304,296 268,280" fill="#E2E8F0" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Pannelli adiacenti superiori e laterali (Alternanza Grigio Chiaro e Arancione Scuro) -->
    <polygon points="280,242 260,208 298,194 316,242" fill="#CBD5E1" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="316,242 355,214 372,248 332,270" fill="#E2E8F0" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="332,270 376,288 358,324 304,296" fill="#CBD5E1" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="304,296 295,342 254,332 268,280" fill="#E2E8F0" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="268,280 224,286 235,248 280,242" fill="#CBD5E1" stroke="#071526" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Pannelli perimetrali arancioni rifiniti -->
    <path d="M 235,248 L 260,208 L 226,220 Z" fill="#FF8400" stroke="#071526" stroke-width="4" />
    <path d="M 298,194 L 355,214 L 340,190 Z" fill="#FF8400" stroke="#071526" stroke-width="4" />
    <path d="M 372,248 L 376,288 L 384,268 Z" fill="#E65100" stroke="#071526" stroke-width="4" />
    <path d="M 358,324 L 295,342 L 332,352 Z" fill="#E65100" stroke="#071526" stroke-width="4" />
    <path d="M 254,332 L 224,286 L 216,316 Z" fill="#FF8400" stroke="#071526" stroke-width="4" />

    <!-- Riflesso morbido flat superiore -->
    <path d="M 240,210 C 275,190 325,190 355,208 C 325,200 275,202 240,210 Z" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- 7. TESTO ARCO SUPERIORE: HANDBALL -->
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" stroke="#05101E" stroke-width="9" paint-order="stroke fill" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      HANDBALL
    </textPath>
  </text>

  <!-- 8. TESTO CENTRALE INFERIORE: SCORE -->
  <g transform="translate(0, 420)">
    <!-- Ombra/Bordo spesso per leggibilità ad alte risoluzioni -->
    <text x="256" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="6" fill="#FFFFFF" stroke="#061221" stroke-width="12" stroke-linejoin="round" paint-order="stroke fill">
      SCORE
    </text>
    <!-- Finitura satinata chiara -->
    <text x="256" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="6" fill="#F4F8FC">
      SCORE
    </text>
  </g>

  <!-- 9. NASTRO / BANNER DORATO INFERIORE PER "PRO" -->
  <g id="pro-badge">
    <!-- Risvolti nastro (sinistra e destra) -->
    <polygon points="175,446 150,446 165,462 145,478 180,478" fill="#B37D14" stroke="#061221" stroke-width="2.5" />
    <polygon points="337,446 362,446 347,462 367,478 332,478" fill="#B37D14" stroke="#061221" stroke-width="2.5" />

    <!-- Corpo principale nastro centrale a scudetto -->
    <path d="M 172,438 L 340,438 L 340,472 L 256,494 L 172,472 Z" fill="url(#goldGrad)" stroke="#061221" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Filetto interno decorativo nastro -->
    <path d="M 178,443 L 334,443 L 334,468 L 256,488 L 178,468 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

    <!-- Testo "PRO" -->
    <text x="256" y="471" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4" fill="#0A182B">
      PRO
    </text>
  </g>
</svg>